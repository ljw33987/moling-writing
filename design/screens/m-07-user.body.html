<div class="m-shell">
  <!--MSTATUS-->

  <div class="m-topbar">
    <button class="m-iconbtn"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-chev-right"/></svg></button>
    <div style="flex:1">
      <div style="font-size:17px;font-weight:700;letter-spacing:-.02em">我的</div>
    </div>
    <button class="m-iconbtn"><svg class="ic"><use href="#i-settings"/></svg></button>
  </div>

  <div class="m-scroll">
    <div class="m-pad">

      <!-- 用户卡 -->
      <div class="m-card pad" style="display:flex;align-items:center;gap:13px">
        <div style="width:52px;height:52px;border-radius:17px;flex:none;background:linear-gradient(140deg,#4F46E5,#7C3AED);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700">梧</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:16px;font-weight:700;letter-spacing:-.01em">梧攸笙歌</span>
            <span class="badge badge-brand" style="height:19px;font-size:10px"><svg class="ic" style="width:10px;height:10px"><use href="#i-crown"/></svg>年卡</span>
          </div>
          <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px">wysg@moli.com</div>
        </div>
        <svg class="ic ic-sm" style="color:var(--ink-4)"><use href="#i-chev-right"/></svg>
      </div>

      <!-- 统计 -->
      <div class="m-stat" style="margin-top:12px">
        <div class="s"><div class="v mono">1,240</div><div class="k">今日字数</div></div>
        <div class="s"><div class="v mono">486,290</div><div class="k">累计字数</div></div>
        <div class="s"><div class="v mono">12</div><div class="k">作品数</div></div>
      </div>

      <!-- Token 余额 -->
      <div class="m-card" style="margin-top:12px;padding:14px;background:linear-gradient(140deg,#F7F7FF,#FDF7FF);border-color:var(--brand-line)">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:36px;height:36px;border-radius:12px;flex:none;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center">
            <svg class="ic ic-sm"><use href="#i-wallet"/></svg>
          </div>
          <div style="flex:1">
            <div style="font-size:11px;color:var(--ink-3)">Token 余额</div>
            <div class="mono" style="font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:1px">128,460</div>
          </div>
          <button class="btn btn-sm btn-primary">充值</button>
        </div>
        <div style="margin-top:11px">
          <div class="progress amber"><i style="width:34%"></i></div>
          <div style="font-size:10.5px;color:var(--ink-3);margin-top:6px">本月已用 21,480 / 50,000 Token</div>
        </div>
      </div>

      <!-- 菜单 -->
      <div class="m-sec"><svg class="ic"><use href="#i-user"/></svg><h2>账户</h2></div>
      <div class="m-list">
        <div class="m-row">
          <div class="ic-box" style="background:var(--violet-soft);color:var(--violet)"><svg class="ic ic-sm"><use href="#i-sparkles"/></svg></div>
          <div class="tx"><h4>AI 模型配置</h4><p>当前 DeepSeek · deepseek-chat</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--amber-soft);color:var(--amber)"><svg class="ic ic-sm"><use href="#i-card"/></svg></div>
          <div class="tx"><h4>兑换码</h4><p>已兑换 3 次 · 查看记录</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--cyan-soft);color:var(--cyan)"><svg class="ic ic-sm"><use href="#i-file"/></svg></div>
          <div class="tx"><h4>充值记录</h4><p>最近 6 笔订单</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--rose-soft);color:var(--rose)"><svg class="ic ic-sm"><use href="#i-bell"/></svg></div>
          <div class="tx"><h4>消息中心</h4><p>3 条未读消息与公告</p></div>
          <span class="badge badge-rose" style="height:19px;font-size:10px">3</span>
        </div>
      </div>

      <div class="m-sec"><svg class="ic"><use href="#i-settings"/></svg><h2>偏好</h2></div>
      <div class="m-list">
        <div class="m-row">
          <div class="ic-box" style="background:var(--surface-3);color:var(--ink-2)"><svg class="ic ic-sm"><use href="#i-type"/></svg></div>
          <div class="tx"><h4>编辑模式</h4><p>打字机</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--surface-3);color:var(--ink-2)"><svg class="ic ic-sm"><use href="#i-sun"/></svg></div>
          <div class="tx"><h4>护眼模式</h4><p>降低长时间写作的视觉疲劳</p></div>
          <div class="switch on" style="width:44px;height:26px"><i style="width:20px;height:20px"></i></div>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--surface-3);color:var(--ink-2)"><svg class="ic ic-sm"><use href="#i-moon"/></svg></div>
          <div class="tx"><h4>深色模式</h4><p>夜间写作更舒适</p></div>
          <div class="switch" style="width:44px;height:26px"><i style="width:20px;height:20px"></i></div>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--surface-3);color:var(--ink-2)"><svg class="ic ic-sm"><use href="#i-globe"/></svg></div>
          <div class="tx"><h4>语言</h4><p>简体中文</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
      </div>

      <div class="m-sec"><svg class="ic"><use href="#i-shield"/></svg><h2>管理</h2></div>
      <div class="m-list">
        <div class="m-row">
          <div class="ic-box" style="background:var(--brand-soft);color:var(--brand)"><svg class="ic ic-sm"><use href="#i-chart"/></svg></div>
          <div class="tx"><h4>管理后台</h4><p>平台运营数据与用户管理</p></div>
          <svg class="ic ic-sm rt"><use href="#i-chev-right"/></svg>
        </div>
        <div class="m-row">
          <div class="ic-box" style="background:var(--surface-3);color:var(--ink-2)"><svg class="ic ic-sm"><use href="#i-logout"/></svg></div>
          <div class="tx"><h4 style="color:var(--rose)">退出登录</h4></div>
        </div>
      </div>

      <div style="height:8px"></div>
    </div>
  </div>

  <!--MTAB:user-->
</div>
