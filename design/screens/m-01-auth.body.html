<div class="m-shell">
  <!--MSTATUS-->

  <!-- 顶部留白 + 品牌 -->
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:0 0 28px 28px;overflow:hidden;position:relative">
    <div style="position:absolute;top:-70px;right:-50px;width:220px;height:220px;border-radius:999px;background:radial-gradient(circle,rgba(99,102,241,.14),transparent 66%)"></div>

    <div style="padding:14px 24px 16px;position:relative">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="brand-mark" style="width:36px;height:36px;border-radius:11px;font-size:17px">墨</div>
        <div>
          <div style="font-size:16px;font-weight:700;letter-spacing:-.01em">墨灵写作</div>
          <div style="font-size:9.5px;color:var(--ink-4);font-weight:600;letter-spacing:.1em">AI NOVEL STUDIO</div>
        </div>
      </div>

      <h1 style="font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-top:20px">
        一句话灵感，<br>长出一整部长篇。
      </h1>
      <p style="font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:10px">
        AI 长文本记忆引擎自动注入世界观、大纲、前情与角色设定，落笔不失忆、不再卡文。
      </p>
    </div>

    <!-- 特性 -->
    <div style="display:flex;gap:8px;padding:0 24px">
      <div style="flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px">
        <div style="width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:7px">
          <svg class="ic ic-sm"><use href="#i-wand"/></svg>
        </div>
        <div style="font-size:12px;font-weight:650">AI 建书</div>
        <div style="font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.45">一句话 → 简介+大纲</div>
      </div>
      <div style="flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px">
        <div style="width:26px;height:26px;border-radius:8px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;margin-bottom:7px">
          <svg class="ic ic-sm"><use href="#i-pen"/></svg>
        </div>
        <div style="font-size:12px;font-weight:650">沉浸写作</div>
        <div style="font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.45">全屏正文 · 无干扰</div>
      </div>
      <div style="flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px">
        <div style="width:26px;height:26px;border-radius:8px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center;margin-bottom:7px">
          <svg class="ic ic-sm"><use href="#i-zap"/></svg>
        </div>
        <div style="font-size:12px;font-weight:650">自动连载</div>
        <div style="font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.45">定时续写 · 睡着也更</div>
      </div>
    </div>

    <!-- 表单 -->
    <div style="padding:16px 24px 0;margin-top:auto">
      <div class="m-seg" style="margin-bottom:14px">
        <button class="on">登录</button>
        <button>注册</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:11px">
        <div class="m-field">
          <label>邮箱</label>
          <div class="inp focus">wysg@moli.com</div>
        </div>
        <div class="m-field">
          <label>密码</label>
          <div class="inp" style="justify-content:space-between">
            <span>••••••••••</span>
            <span style="font-size:12px;color:var(--brand);font-weight:600">忘记？</span>
          </div>
        </div>

        <button class="m-btn primary" style="margin-top:2px">登录</button>

        <div style="display:flex;align-items:center;gap:10px;color:var(--ink-4);font-size:11px">
          <span style="flex:1;height:1px;background:var(--line)"></span>其他方式<span style="flex:1;height:1px;background:var(--line)"></span>
        </div>

        <button class="m-btn outline" style="gap:7px">
          <svg class="ic ic-sm"><use href="#i-key"/></svg>使用兑换码进入
        </button>
      </div>
    </div>

    <div style="padding:12px 24px 16px">
      <div class="m-tip">
        <svg class="ic ic-sm" style="flex:none;margin-top:1px"><use href="#i-info"/></svg>
        <span>新用户注册即赠送 <b>10,000 Token</b>，可直接体验全部 AI 写作功能。</span>
      </div>
      <p style="font-size:10.5px;color:var(--ink-4);text-align:center;margin-top:10px">
        登录即表示同意《用户协议》和《隐私政策》
      </p>
    </div>
  </div>
</div>
